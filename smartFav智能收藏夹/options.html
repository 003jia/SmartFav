<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFav 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 500px;
      min-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 24px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group:last-child {
      margin-bottom: 0;
    }
    
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }
    
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #1976d2;
    }
    
    .api-key-group {
      position: relative;
    }
    
    .api-key-group input {
      padding-right: 40px;
    }
    
    .toggle-visibility {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1565c0;
    }
    
    .btn-secondary {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .btn-secondary:hover {
      background: #bbdefb;
    }
    
    .test-result {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    
    .test-result.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }
    
    .test-result.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }
    
    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>⭐ SmartFav 设置</h1>
  
  <!-- API 配置 -->
  <div class="section">
    <div class="section-title">AI API 配置</div>
    
    <div class="form-group">
      <label>API 提供商</label>
      <select id="apiProvider">
        <option value="minimax">MiniMax</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>API Key</label>
      <div class="api-key-group">
        <input type="password" id="apiKey" placeholder="请输入 API Key">
        <button class="toggle-visibility" id="toggleVisibility">👁️</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>模型</label>
      <input type="text" id="model" placeholder="如: MiniMax-M2.5">
    </div>
    
    <div class="btn-group">
      <button class="btn btn-secondary" id="testBtn">测试连接</button>
    </div>
    
    <div id="testResult" class="test-result"></div>
  </div>
  
  <!-- 分类设置 -->
  <div class="section">
    <div class="section-title">收藏夹分类</div>
    
    <div class="form-group">
      <label>分类列表（用逗号分隔）</label>
      <input type="text" id="categories" placeholder="视频, 编程, 工具, 学习, 资讯, 其他">
    </div>
  </div>
  
  <!-- 保存按钮 -->
  <div class="btn-group">
    <button class="btn btn-primary" id="saveBtn">保存设置</button>
  </div>
  
  <div class="footer">
    SmartFav v1.0.0 - AI 智能收藏夹
  </div>
  
  <script src="options.js"></script>
</body>
</html>
